# 1177 Integration
integration.elva77.getuserprofile.endpoint=${integration.elva77.baseurl}/userprofile/soap/GetUserProfile/2.0
integration.elva77.client.tls.version=TLS
# cipherSuites can be empty for defaults
integration.elva77.client.tls.cipherSuites=

integration.ntjp.client.tls.version=TLSv1.3
integration.ntjp.client.tls.cipherSuites=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_AES_128_CCM_SHA256,TLS_AES_128_CCM_8_SHA256,TLS_CHACHA20_POLY1305_SHA256

# PU Configuration
